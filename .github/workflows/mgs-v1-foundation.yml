name: MGS V1 foundation regression

on:
  push:
    branches:
      - main
      - mgs-v1-foundation-20261105
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check patched ESM bundles
        run: |
          node --input-type=module --check < assets/mgs-v1-core.js
          node --input-type=module --check < assets/store-BjDoKEky.js
          node --input-type=module --check < assets/strategy-DKwdk79U.js
      - run: node tests/mgs-v1-foundation.test.mjs
