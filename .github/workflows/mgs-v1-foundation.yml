name: MGS V1 foundation regression

on:
  push:
    branches:
      - main
      - mgs-v1-foundation-20261105
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/mgs-v1-foundation.test.mjs
